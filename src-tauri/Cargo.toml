[package]
name = "app"
version = "2.5.3"
description = "A Tauri App"
authors = ["IVG Design"]
license = "MIT"
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.88.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["unstable"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.46", features = ["full"] }
tokio-tungstenite = "0.24"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", default-features = false, features = ["alloc"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-quartz-core", "objc2-uniform-type-identifiers", "NSButton", "NSControl", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSProcessInfo", "NSString", "NSURL"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
