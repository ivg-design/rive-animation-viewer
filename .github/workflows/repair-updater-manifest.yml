name: Repair Updater Manifest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to repair (for example vX.Y.Z). Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rav-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair-updater-manifest:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.20.0"

      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-v$(node -p "require('./package.json').version")}"
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          version="${TAG#v}"
          VERSION="$version" node -e \
            "if (!/^\\d+\\.\\d+\\.\\d+$/.test(process.env.VERSION)) process.exit(1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download updater payloads and signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          asset_dir=/tmp/rav-updater-assets
          mkdir -p "$asset_dir"

          if [[ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "Updater repair is only allowed for an already-published release"
            exit 1
          fi

          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/src-tauri/tauri.conf.json?ref=$TAG" \
            > /tmp/rav-tag-tauri.conf.json
          CONFIG_PATH=/tmp/rav-tag-tauri.conf.json node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, 'utf8'));
          if (config.version !== process.env.VERSION) {
            throw new Error(
              `Tagged Tauri config version ${config.version} does not match ${process.env.VERSION}`,
            );
          }
          if (!config?.plugins?.updater?.pubkey) {
            throw new Error('Tagged Tauri config has no updater public key');
          }
          NODE

          gh release download "$TAG" \
            --repo "$REPO" \
            --dir "$asset_dir" \
            --pattern "*.app.tar.gz" \
            --pattern "*.msi" \
            --pattern "*-setup.exe" \
            --pattern "*.sig"

      - name: Cryptographically verify every updater payload
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          asset_dir=/tmp/rav-updater-assets

          npm run verify:updater-signatures -- \
            --config /tmp/rav-tag-tauri.conf.json \
            "$asset_dir/Rive.Animation.Viewer_aarch64.app.tar.gz" \
            "$asset_dir/Rive.Animation.Viewer_x64.app.tar.gz" \
            "$asset_dir/Rive.Animation.Viewer_${VERSION}_x64_en-US.msi" \
            "$asset_dir/Rive.Animation.Viewer_${VERSION}_x64-setup.exe"

      - name: Rebuild canonical latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$REPO" --json assets,body,publishedAt,tagName > /tmp/rav-release.json
          node scripts/generate-updater-manifest.mjs --release-file /tmp/rav-release.json --signature-dir /tmp/rav-updater-assets --output /tmp/latest.json
          TAG="$TAG" node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/latest.json', 'utf8'));
          const urls = Object.values(manifest.platforms).map((entry) => entry.url);
          if (urls.length === 0 || urls.some((url) => url.includes('/untagged-') || !url.includes(`/download/${process.env.TAG}/`))) {
            throw new Error('latest.json contains a non-canonical release asset URL');
          }
          if (`v${manifest.version}` !== process.env.TAG) {
            throw new Error(`latest.json version ${manifest.version} does not match ${process.env.TAG}`);
          }
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Replace latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release upload "$TAG" /tmp/latest.json#latest.json --repo "$REPO" --clobber
