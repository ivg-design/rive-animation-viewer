name: Stage Signed Tauri Updater Candidate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 2.5.5). Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rav-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: >-
      github.event_name != 'push' ||
      startsWith(github.event.head_commit.message, 'chore(release): v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      counter_endpoint: ${{ steps.counter.outputs.endpoint }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.20.0"

      - name: Resolve and verify release version
        id: meta
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail

          package_version=$(node -p "require('./package.json').version")

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$DISPATCH_VERSION" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="$package_version"
          fi

          actual_subject=$(git log -1 --pretty=%s)
          expected_subject="chore(release): v$package_version"
          if [[ "$actual_subject" != "$expected_subject" ]]; then
            echo "Release commit subject must be exactly: $expected_subject"
            echo "Actual subject: $actual_subject"
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release commit must already be reachable from origin/main"
            exit 1
          fi

          node scripts/check-release-version.mjs \
            --version "$version" \
            --require-release-notes

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Preparing complete release $version"

      - name: Validate the canonical anonymous counter endpoint
        id: counter
        shell: bash
        env:
          RAV_COUNTER_ENDPOINT: ${{ vars.RAV_COUNTER_ENDPOINT }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {
            const endpoint = new URL(process.env.RAV_COUNTER_ENDPOINT || '');
            if (endpoint.protocol !== 'https:' || endpoint.pathname !== '/v1/event'
                || endpoint.search || endpoint.hash || endpoint.username || endpoint.password) {
              throw new Error('RAV_COUNTER_ENDPOINT must be a credential-free HTTPS /v1/event URL');
            }

            const healthUrl = new URL('/v1/health', endpoint);
            const response = await fetch(healthUrl, {
              headers: { accept: 'text/plain' },
              redirect: 'error',
              signal: AbortSignal.timeout(10_000),
            });
            if (response.status !== 204) {
              throw new Error(`Anonymous counter health check returned ${response.status}`);
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `endpoint=${endpoint.href}\n`);
            console.log(`Anonymous counter is healthy at ${healthUrl.origin}/v1/health`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Extract release notes from changelog
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const version = process.env.VERSION;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const heading = new RegExp(`^## \\[${escapedVersion}\\](?: - .+)?$`, 'm');
          const match = changelog.match(heading);

          if (!match || match.index === undefined) {
            throw new Error(`CHANGELOG.md has no release section for ${version}`);
          }

          const sectionStart = match.index + match[0].length;
          const nextSection = changelog.indexOf('\n## ', sectionStart);
          const body = changelog
            .slice(sectionStart, nextSection === -1 ? undefined : nextSection)
            .trim();

          if (!body) {
            throw new Error(`CHANGELOG.md release section for ${version} is empty`);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `body<<RAV_RELEASE_NOTES_EOF\n${body}\nRAV_RELEASE_NOTES_EOF\n`,
          );
          NODE

      - name: Create or validate the draft release
        id: draft
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail

          releases_path="$RUNNER_TEMP/rav-releases.json"
          release_path="$RUNNER_TEMP/rav-release.json"
          tag_ref_path="$RUNNER_TEMP/rav-tag-ref.json"
          tag_object_path="$RUNNER_TEMP/rav-tag-object.json"
          release_commit=$(git rev-parse 'HEAD^{commit}')

          resolve_tag_commit() {
            local object_sha
            local object_type
            local status
            local depth=0

            if ! gh api "repos/$REPO/git/ref/tags/$TAG" > "$tag_ref_path"; then
              status=$(TAG_REF_PATH="$tag_ref_path" node -p \
                "JSON.parse(require('node:fs').readFileSync(process.env.TAG_REF_PATH, 'utf8')).status")
              if [[ "$status" == 404 ]]; then
                return 0
              fi
              echo "Failed to inspect existing tag $TAG (HTTP $status)" >&2
              return 1
            fi

            object_type=$(TAG_REF_PATH="$tag_ref_path" node -p \
              "JSON.parse(require('node:fs').readFileSync(process.env.TAG_REF_PATH, 'utf8')).object.type")
            object_sha=$(TAG_REF_PATH="$tag_ref_path" node -p \
              "JSON.parse(require('node:fs').readFileSync(process.env.TAG_REF_PATH, 'utf8')).object.sha")

            while [[ "$object_type" == "tag" ]]; do
              depth=$((depth + 1))
              if (( depth > 8 )); then
                echo "Annotated tag chain for $TAG is unexpectedly deep" >&2
                return 1
              fi
              gh api "repos/$REPO/git/tags/$object_sha" > "$tag_object_path"
              object_type=$(TAG_OBJECT_PATH="$tag_object_path" node -p \
                "JSON.parse(require('node:fs').readFileSync(process.env.TAG_OBJECT_PATH, 'utf8')).object.type")
              object_sha=$(TAG_OBJECT_PATH="$tag_object_path" node -p \
                "JSON.parse(require('node:fs').readFileSync(process.env.TAG_OBJECT_PATH, 'utf8')).object.sha")
            done

            if [[ "$object_type" != "commit" ]]; then
              echo "Tag $TAG resolves to unsupported object type $object_type" >&2
              return 1
            fi
            printf '%s' "$object_sha"
          }

          tag_commit=$(resolve_tag_commit)
          if [[ -n "$tag_commit" && "$tag_commit" != "$release_commit" ]]; then
            echo "Tag $TAG points to $tag_commit, not release commit $release_commit"
            exit 1
          fi

          gh api --paginate --slurp \
            "repos/$REPO/releases?per_page=100" > "$releases_path"

          RELEASES_PATH="$releases_path" RELEASE_PATH="$release_path" node <<'NODE'
          const fs = require('node:fs');
          const pages = JSON.parse(fs.readFileSync(process.env.RELEASES_PATH, 'utf8'));
          const matches = pages.flat().filter((release) => release.tag_name === process.env.TAG);
          if (matches.length > 1) {
            throw new Error(`Found multiple releases for ${process.env.TAG}`);
          }
          if (matches.length === 1) {
            fs.writeFileSync(process.env.RELEASE_PATH, JSON.stringify(matches[0]));
          }
          NODE

          if [[ ! -s "$release_path" ]]; then
            gh api --method POST "repos/$REPO/releases" \
              --raw-field "tag_name=$TAG" \
              --raw-field "target_commitish=$release_commit" \
              --raw-field "name=Rive Animation Viewer v$VERSION" \
              --raw-field "body=$RELEASE_BODY" \
              -F draft=true \
              -F prerelease=false > "$release_path"
          fi

          RELEASE_PATH="$release_path" EXPECTED_SHA="$release_commit" node <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_PATH, 'utf8'));
          if (release.draft !== true) {
            throw new Error(
              `Refusing to mutate existing public release ${release.html_url || release.tag_name}`,
            );
          }
          if (release.prerelease === true) {
            throw new Error(`Release ${release.tag_name} must not be a prerelease`);
          }
          if (release.target_commitish !== process.env.EXPECTED_SHA) {
            throw new Error(
              `Draft target ${release.target_commitish} does not match ${process.env.EXPECTED_SHA}`,
            );
          }
          process.stdout.write(`Validated draft release ${release.id}\n`);
          NODE

          release_id=$(RELEASE_PATH="$release_path" node -p \
            "JSON.parse(require('node:fs').readFileSync(process.env.RELEASE_PATH, 'utf8')).id")
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare-release
    environment: apple-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            rust_target: aarch64-apple-darwin
            updater_arch: aarch64
          - name: macOS Intel
            rust_target: x86_64-apple-darwin
            updater_arch: x86_64
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Import the release signing identity and materialize the API key
        id: apple
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          for required_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_PRIVATE_KEY_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            APPLE_TEAM_ID
          do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Required Apple release setting is missing: $required_name"
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          certificate_path="$RUNNER_TEMP/rav-developer-id.p12"
          keychain_path="$RUNNER_TEMP/rav-release-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "api_key_path=$key_path" >> "$GITHUB_OUTPUT"
          echo "certificate_path=$certificate_path" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"

          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" \
            | openssl base64 -d -A -out "$key_path"
          chmod 600 "$key_path"
          openssl pkey -in "$key_path" -check -noout

          printf '%s' "$APPLE_CERTIFICATE" \
            | openssl base64 -d -A -out "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain=${existing_keychain//\"/}
            [[ -n "$existing_keychain" ]] && existing_keychains+=("$existing_keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"

          identities=$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n "s/.*\"\(Developer ID Application:.*(${APPLE_TEAM_ID})\)\".*/\1/p")
          identity_count=$(printf '%s\n' "$identities" | sed '/^$/d' | wc -l | tr -d ' ')
          if [[ "$identity_count" != 1 ]]; then
            echo "Expected exactly one Developer ID Application identity for $APPLE_TEAM_ID; found $identity_count"
            exit 1
          fi
          signing_identity=$(printf '%s\n' "$identities" | sed -n '1p')

          echo "signing_identity=$signing_identity" >> "$GITHUB_OUTPUT"

      - name: Acquire, sign, and verify production encoders (${{ matrix.name }})
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.apple.outputs.signing_identity }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAV_ENCODER_TARGET: ${{ matrix.rust_target }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/rav-encoder-work-${RAV_ENCODER_TARGET}"
          cache_dir="$RUNNER_TEMP/rav-encoder-cache-${RAV_ENCODER_TARGET}"
          output_dir="$GITHUB_WORKSPACE/src-tauri/encoder-resources/encoders"
          node scripts/encoder-distribution/encoders.mjs acquire \
            --target "$RAV_ENCODER_TARGET" \
            --work-dir "$work_dir" \
            --cache-dir "$cache_dir" \
            --output "$output_dir" \
            --mac-signing-identity "$APPLE_SIGNING_IDENTITY"
          node scripts/encoder-distribution/encoders.mjs verify \
            --target "$RAV_ENCODER_TARGET" \
            --directory "$output_dir"

          if [[ "$RAV_ENCODER_TARGET" == "aarch64-apple-darwin" ]]; then
            source_asset="$RUNNER_TEMP/jellyfin-ffmpeg-v7.1.4-3-source.tar.gz"
            cp "$cache_dir/v7.1.4-3.tar.gz" "$source_asset"
            test "$(stat -f %z "$source_asset")" = "16698965"
            test "$(shasum -a 256 "$source_asset" | awk '{print $1}')" \
              = "38fff90f73b3c4f9c3c7270711411a4ec3cbe63b205d4b4a5525bcc532d3d31f"
            gh release upload "$TAG" "$source_asset" --repo "$REPO" --clobber
          fi

      - name: Build, sign, notarize app, and upload (${{ matrix.name }})
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple.outputs.signing_identity }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.api_key_path }}
          RAV_COUNTER_ENDPOINT: ${{ needs.prepare-release.outputs.counter_endpoint }}
          RAV_ENCODER_TARGET: ${{ matrix.rust_target }}
          RAV_OFFICIAL_RELEASE: "1"
        with:
          tauriScript: npm run tauri
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target ${{ matrix.rust_target }}

      - name: Notarize, staple, and replace the DMG
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.api_key_path }}
        run: |
          set -euo pipefail

          dmg_dir="src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg"
          dmg_count=$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          if [[ "$dmg_count" != 1 ]]; then
            echo "Expected exactly one DMG in $dmg_dir; found $dmg_count"
            exit 1
          fi
          dmg_path=$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          result_path="$RUNNER_TEMP/dmg-notarization.json"

          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 180m \
            --output-format json > "$result_path"

          status=$(RESULT_PATH="$result_path" node -p \
            "JSON.parse(require('node:fs').readFileSync(process.env.RESULT_PATH, 'utf8')).status")
          submission_id=$(RESULT_PATH="$result_path" node -p \
            "JSON.parse(require('node:fs').readFileSync(process.env.RESULT_PATH, 'utf8')).id")

          if [[ "$status" != "Accepted" ]]; then
            xcrun notarytool log "$submission_id" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER"
            echo "DMG notarization failed with status: $status"
            exit 1
          fi

          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          gh release upload "$TAG" "$dmg_path" --repo "$REPO" --clobber

      - name: Verify signed direct-download and updater artifacts
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          bundle_dir="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          dmg_path=$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          updater_archive=$(find "$bundle_dir/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)

          scripts/verify-macos-distribution.sh \
            "$dmg_path" \
            "$updater_archive" \
            "$APPLE_TEAM_ID" \
            "${{ matrix.updater_arch }}" \
            "${{ needs.prepare-release.outputs.version }}"

      - name: Remove materialized Apple credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "${{ steps.apple.outputs.api_key_path }}" \
            "${{ steps.apple.outputs.certificate_path }}" \
            "$RUNNER_TEMP/dmg-notarization.json"
          if [[ -n "${{ steps.apple.outputs.keychain_path }}" ]]; then
            security delete-keychain "${{ steps.apple.outputs.keychain_path }}" || true
          fi

  build-windows:
    needs: prepare-release
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Acquire and verify production encoders
        shell: pwsh
        env:
          RAV_ENCODER_TARGET: x86_64-pc-windows-msvc
        run: |
          $ErrorActionPreference = 'Stop'
          $workDir = Join-Path $env:RUNNER_TEMP "rav-encoder-work-$env:RAV_ENCODER_TARGET"
          $cacheDir = Join-Path $env:RUNNER_TEMP "rav-encoder-cache-$env:RAV_ENCODER_TARGET"
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\encoder-resources\encoders'
          node scripts/encoder-distribution/encoders.mjs acquire `
            --target $env:RAV_ENCODER_TARGET `
            --work-dir $workDir `
            --cache-dir $cacheDir `
            --output $outputDir
          if ($LASTEXITCODE -ne 0) { throw 'Production encoder acquisition failed' }
          node scripts/encoder-distribution/encoders.mjs verify `
            --target $env:RAV_ENCODER_TARGET `
            --directory $outputDir
          if ($LASTEXITCODE -ne 0) { throw 'Production encoder verification failed' }

      - name: Build and upload Windows x64
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RAV_COUNTER_ENDPOINT: ${{ needs.prepare-release.outputs.counter_endpoint }}
          RAV_ENCODER_TARGET: x86_64-pc-windows-msvc
          RAV_OFFICIAL_RELEASE: "1"
        with:
          tauriScript: npm run tauri
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target x86_64-pc-windows-msvc

  verify-draft-release:
    needs:
      - prepare-release
      - build-macos
      - build-windows
    permissions:
      # GitHub hides draft releases from tokens without contents write access.
      contents: write
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.20.0"

      - name: Download and inventory the draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "Release $TAG must remain a draft until verification completes"
            exit 1
          fi

          asset_dir="$RUNNER_TEMP/rav-release-assets"
          mkdir -p "$asset_dir"
          gh release download "$TAG" --repo "$REPO" --dir "$asset_dir"

          required_assets=(
            "Rive.Animation.Viewer_${VERSION}_aarch64.dmg"
            "Rive.Animation.Viewer_${VERSION}_x64.dmg"
            "Rive.Animation.Viewer_aarch64.app.tar.gz"
            "Rive.Animation.Viewer_aarch64.app.tar.gz.sig"
            "Rive.Animation.Viewer_x64.app.tar.gz"
            "Rive.Animation.Viewer_x64.app.tar.gz.sig"
            "Rive.Animation.Viewer_${VERSION}_x64_en-US.msi"
            "Rive.Animation.Viewer_${VERSION}_x64_en-US.msi.sig"
            "Rive.Animation.Viewer_${VERSION}_x64-setup.exe"
            "Rive.Animation.Viewer_${VERSION}_x64-setup.exe.sig"
            "jellyfin-ffmpeg-v7.1.4-3-source.tar.gz"
          )

          for asset in "${required_assets[@]}"; do
            test -s "$asset_dir/$asset" || {
              echo "Required release asset is missing or empty: $asset"
              exit 1
            }
          done

          source_asset="$asset_dir/jellyfin-ffmpeg-v7.1.4-3-source.tar.gz"
          test "$(stat -f %z "$source_asset")" = "16698965"
          test "$(shasum -a 256 "$source_asset" | awk '{print $1}')" \
            = "38fff90f73b3c4f9c3c7270711411a4ec3cbe63b205d4b4a5525bcc532d3d31f"

      - name: Cryptographically verify every updater payload
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/rav-release-assets"

          npm run verify:updater-signatures -- \
            "$asset_dir/Rive.Animation.Viewer_aarch64.app.tar.gz" \
            "$asset_dir/Rive.Animation.Viewer_x64.app.tar.gz" \
            "$asset_dir/Rive.Animation.Viewer_${VERSION}_x64_en-US.msi" \
            "$asset_dir/Rive.Animation.Viewer_${VERSION}_x64-setup.exe"

      - name: Verify both notarized macOS distributions
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/rav-release-assets"

          scripts/verify-macos-distribution.sh \
            "$asset_dir/Rive.Animation.Viewer_${VERSION}_aarch64.dmg" \
            "$asset_dir/Rive.Animation.Viewer_aarch64.app.tar.gz" \
            "$APPLE_TEAM_ID" \
            aarch64 \
            "$VERSION"

          scripts/verify-macos-distribution.sh \
            "$asset_dir/Rive.Animation.Viewer_${VERSION}_x64.dmg" \
            "$asset_dir/Rive.Animation.Viewer_x64.app.tar.gz" \
            "$APPLE_TEAM_ID" \
            x86_64 \
            "$VERSION"

  stage-private-updater-candidate:
    needs:
      - prepare-release
      - verify-draft-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.20.0"

      - name: Download verified updater assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          mkdir -p /tmp/rav-updater-stage
          gh release download "$TAG" \
            --repo "$REPO" \
            --dir /tmp/rav-updater-stage

      - name: Build and verify merged latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          gh release view "$TAG" \
            --repo "$REPO" \
            --json assets,body,createdAt,isDraft,publishedAt,tagName,targetCommitish > /tmp/rav-release.json

          node scripts/generate-updater-manifest.mjs \
            --release-file /tmp/rav-release.json \
            --signature-dir /tmp/rav-updater-stage \
            --output /tmp/rav-updater-stage/latest.json

          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/rav-updater-stage/latest.json', 'utf8'));
          const expectedVersion = process.env.VERSION;
          const expectedTag = process.env.TAG;

          if (JSON.parse(fs.readFileSync('/tmp/rav-release.json', 'utf8')).isDraft !== true) {
            throw new Error(`Release ${expectedTag} stopped being a draft before publication`);
          }
          if (manifest.version !== expectedVersion) {
            throw new Error(
              `Manifest version mismatch: expected ${expectedVersion}, got ${manifest.version}`,
            );
          }

          for (const [platform, entry] of Object.entries(manifest.platforms)) {
            if (!entry.url.includes(`/releases/download/${expectedTag}/`)) {
              throw new Error(`${platform} has a non-canonical URL: ${entry.url}`);
            }
            if (!entry.signature) {
              throw new Error(`${platform} is missing its updater signature`);
            }
          }

          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Upload private canonical latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = "true"
          gh release upload "$TAG" /tmp/rav-updater-stage/latest.json#latest.json --repo "$REPO" --clobber

      - name: Create immutable updater byte ledger
        env:
          COMMIT: ${{ github.sha }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          source_asset="/tmp/rav-updater-stage/jellyfin-ffmpeg-v7.1.4-3-source.tar.gz"
          test "$(stat -c %s "$source_asset")" = "16698965"
          test "$(sha256sum "$source_asset" | awk '{print $1}')" \
            = "38fff90f73b3c4f9c3c7270711411a4ec3cbe63b205d4b4a5525bcc532d3d31f"
          node scripts/updater-staging-ledger.mjs create \
            --asset-dir /tmp/rav-updater-stage \
            --commit "$COMMIT" \
            --config src-tauri/tauri.conf.json \
            --output /tmp/rav-updater-stage/updater-staging-ledger.json \
            --release-file /tmp/rav-release.json \
            --release-id "$RELEASE_ID" \
            --repository "$REPO" \
            --version "$VERSION"

      - name: Hold candidate privately for signed acceptance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = "true"
          gh release upload "$TAG" \
            /tmp/rav-updater-stage/updater-staging-ledger.json#updater-staging-ledger.json \
            --repo "$REPO" \
            --clobber
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = "true"
          echo "Candidate $TAG remains a private draft. Run isolated acceptance, upload its receipt, then dispatch Promote Accepted Updater Candidate."
